services:
  - type: web
    name: email-outreach-automation
    runtime: python3
    # Run DB migrations and seed plans on every deploy before starting
    buildCommand: pip install -r requirements.txt && flask db upgrade && flask seed-plans
    startCommand: python run.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: false

      # Render auto-generates a cryptographically strong secret
      - key: FLASK_SECRET_KEY
        generateValue: true

      # Injected automatically from the DB instance created below
      - key: DATABASE_URL
        fromDatabase:
          name: email-crm-audit-db
          property: connectionString

      # ── Resend (transactional email) — set in dashboard after signup ──────
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Outreach AI

      # ── Google OAuth SSO — console.cloud.google.com ───────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Relax oauthlib's scope-equality check. When a user is already signed in
      # via Google SSO, the Gmail-connect consent returns a SUPERSET of the
      # requested scopes (adds openid/userinfo.email/userinfo.profile), which
      # otherwise raises "Scope has changed" in gmail_oauth.handle_callback and
      # breaks Connect Gmail. See Session 8 (2026-09-08).
      - key: OAUTHLIB_RELAX_TOKEN_SCOPE
        value: "1"

      # ── Microsoft OAuth SSO — portal.azure.com ────────────────────────────
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common

      # ── Existing secrets ──────────────────────────────────────────────────
      - key: GOOGLE_OAUTH_CONFIG
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false

      # ── Stripe — wired, not yet active ───────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

    disk:
      name: user-data
      mountPath: /opt/render/project/src/user_data
      sizeGB: 5

# PostgreSQL — provisioned via Render MCP (id: dpg-dagcclqjnfac739k2q60-a, PG16)
# PAID basic_256mb plan, created 2026-09-09. The original FREE instance
# (dpg-d9051ee8bjmc738te970-a) hit its 2026-07-27 expiry and was auto-deleted,
# which broke OAuth login with "could not translate host name" 500s at the
# callback until this paid DB was provisioned and DATABASE_URL relinked.
# Do NOT downgrade to free — free instances expire and take login down with them.
databases:
  - name: email-crm-audit-db
    plan: basic_256mb