name: Repo checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # match Render (see CLAUDE.md)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "bandit>=1.9,<2"

      - name: Run scripts/check.sh
        run: PYTHON="$(which python)" bash scripts/check.sh
